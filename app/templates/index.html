<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Voice Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>Local Voice Assistant</h1>
    <p class="subtitle">
      Click the button, say one English sentence, click again to stop.
      Follow-up questions keep the context of this conversation.
    </p>

    <section class="conversation" id="conversation" aria-label="Conversation" aria-live="polite" hidden>
      <ol id="turns" class="turns"></ol>
      <button id="reset-btn" class="link-btn" type="button">New conversation</button>
    </section>

    <button id="record-btn" class="record-btn" type="button">
      <span class="dot" aria-hidden="true"></span>
      <span id="record-label">Start recording</span>
    </button>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="error" class="error" role="alert" hidden></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
